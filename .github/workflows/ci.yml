name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Repository checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.10'
          enable-cache: true
      - name: Install locked tools
        run: uv sync --locked
      - name: Run shared checks
        run: uv run --locked python scripts/check.py
      - name: Save documentation for review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: documentation-${{ matrix.os }}-${{ github.run_id }}
          path: site/
          if-no-files-found: error
          retention-days: 7
      - name: Record scope
        run: echo 'Contract tests and repository checks passed. The documentation artifact is available for review.' >> "$GITHUB_STEP_SUMMARY"
