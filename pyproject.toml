[project]
name = "resinsight-mcp"
version = "0.1.0"
description = "Repository tools and documentation for resinsight-mcp."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pre-commit>=4.3",
  "pytest>=8.4",
  "ruff>=0.12",
  "ty>=0.0.1",
  "mkdocs-material>=9.6",
  "mkdocs-include-markdown-plugin>=7.1",
  "pymdown-extensions>=10.16",
  "mcp>=1.28,<2",
  "pillow>=12,<13",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ty.environment]
python-version = "3.12"
