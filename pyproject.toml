[project]
name = "resinsight-mcp"
version = "0.1.0"
description = "Typed services, durable workspaces, and local MCP transport for ResInsight."
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.13.5,<3", "mcp>=1.28,<2", "pillow>=12,<13"]

[project.optional-dependencies]
resinsight = ["rips==2026.9.0.1", "psutil>=7.2,<8"]

[build-system]
requires = ["setuptools>=84,<85"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["resinsight_mcp*"]

[tool.setuptools.package-data]
resinsight_mcp = ["py.typed"]

[dependency-groups]
dev = [
  "pre-commit>=4.3",
  "pytest>=8.4",
  "ruff>=0.12",
  "ty>=0.0.1",
  "mkdocs-material>=9.6",
  "mkdocs-include-markdown-plugin>=7.1",
  "pymdown-extensions>=10.16",
  "rips==2026.9.0.1",
  "psutil>=7.2,<8",
  "grpcio-tools>=1.83.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"

[tool.ty.environment]
python-version = "3.12"
