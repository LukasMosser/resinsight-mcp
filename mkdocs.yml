site_name: resinsight-mcp
site_description: Operate ResInsight workflows through an MCP-enabled agent.
site_url: https://lukasmosser.github.io/resinsight-mcp/
repo_url: https://github.com/LukasMosser/resinsight-mcp
repo_name: LukasMosser/resinsight-mcp
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - content.code.copy

nav:
  - Home: index.md
  - Connect an agent: mcp.md
  - Tutorials:
      - Overview: tutorials/index.md
      - Sessions and projects: tutorials/sessions.md
      - Views and images: tutorials/views.md
      - Local jobs: tutorials/jobs.md
  - ResInsight sessions: sessions.md
  - ResInsight views: views.md
  - Local jobs: jobs.md
  - Constrained models: synthetic-models.md
  - Security: security.md
  - License: license.md
  - Development:
      - Overview: development/index.md
      - Agent workflows: development/agent-workflows.md
      - Agent guide: development/agent-guide.md
      - Local setup: development/local-setup.md
      - GitHub organization: development/project-organization.md
      - Platform proof:
          - Overview: development/platform-proof.md
          - ResInsight: development/platform-resinsight.md
          - OPM: development/platform-opm.md
          - Native images: development/platform-images.md
      - Testing and review: development/testing-and-review.md
      - Shared contracts: development/contracts.md
      - Well control contracts: development/well-contracts.md
      - Workspace storage: development/workspaces.md
      - Session implementation: development/sessions.md
      - Session evidence: development/p04-evidence.md
      - Trusted project mutations: development/session-mutations.md
      - MCP transport: development/mcp.md
      - MCP evidence: development/mcp-evidence.md
      - Launcher evidence: development/launcher-evidence.md
      - View control: development/views.md
      - View evidence: development/p06-evidence.md
      - Model imports: development/model-imports.md
      - Model import evidence: development/p07-evidence.md
      - Model materialization evidence: development/model-materialization-evidence.md
      - Constrained models: development/synthetic-models.md
      - Model numerical evidence: development/evidence/p08/README.md
      - Model native evidence: development/evidence/p08-native/README.md
      - Job implementation: development/jobs.md
      - Job evidence: development/p10-evidence.md
      - Architecture: development/architecture.md
      - Implementation plan: development/implementation-plan.md
      - Scope review: development/scope-review.md
      - Foundation evidence: development/foundation-evidence.md
      - Releases: development/releases.md

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
